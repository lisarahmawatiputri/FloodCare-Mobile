name: Flutter CI

on:
  push:
    branches:
      - main
      - auth-sanctum
      - "feature/**"

  pull_request:
    branches:
      - main
      - auth-sanctum
      - "feature/**"

jobs:
  flutter-test:
    name: Analyze and Test Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test
